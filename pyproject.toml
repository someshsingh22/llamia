[project]
name = "llamia"
version = "0.1.0"
description = "LLM training with VERL + vLLM"
requires-python = ">=3.10"
dependencies = [
    "chess>=1.11.2",
    "datasets>=4.8.4",
    "httpx>=0.28.1",
    "numpy>=1.26.4",
    "pyarrow>=24.0.0",
    "python-dotenv>=1.2.2",
    "scipy>=1.15.3",
    "verl>=0.7.1",
    "vllm>=0.9.1",
    "wandb>=0.26.1",
]

[tool.uv]
override-dependencies = [
    "torch==2.8.0+cu126",
    "torchvision==0.23.0+cu126",
    "torchaudio==2.8.0+cu126",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]
torchvision = [{ index = "pytorch-cu126" }]
torchaudio = [{ index = "pytorch-cu126" }]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
