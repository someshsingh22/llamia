defaults:
  - ppo_trainer
  - _self_

# Model
actor_rollout_ref:
  model:
    path: Qwen/Qwen3.5-122B-A10B-FP8
    use_remove_padding: True
    enable_gradient_checkpointing: True
    trust_remote_code: True

  actor:
    optim:
      lr: 1e-6
    ppo_mini_batch_size: 64
    ppo_micro_batch_size_per_gpu: 1
    use_dynamic_bsz: True
    ppo_max_token_len_per_gpu: 8192
    fsdp_config:
      param_offload: False
      optimizer_offload: False
      fsdp_size: -1

  rollout:
    name: vllm
    mode: async
    # nnodes: 1 means using standalone rollout server (your running vllm)
    nnodes: 1
    n_gpus_per_node: 8
    temperature: 1.0
    top_p: 0.9
    top_k: -1
    response_length: 2048
    prompt_length: 1024
    max_model_len: 4000
    max_num_batched_tokens: 32768
    gpu_memory_utilization: 0.85
    enable_prefix_caching: True
    tensor_model_parallel_size: 1
    expert_parallel_size: 8
    dtype: bfloat16
    quantization: fp8
    load_format: safetensors
    engine_kwargs:
      vllm:
        enable_expert_parallel: True
        reasoning_parser: qwen3
        tool_call_parser: hermes
        enable_auto_tool_choice: True
    checkpoint_engine:
      backend: nccl

  ref:
    fsdp_config:
      param_offload: True

# Critic
critic:
  optim:
    lr: 1e-5
  model:
    path: Qwen/Qwen3.5-122B-A10B-FP8
    trust_remote_code: True
  ppo_micro_batch_size_per_gpu: 1

# Data
data:
  tokenizer: Qwen/Qwen3.5-122B-A10B-FP8
  train_files: data/train.parquet
  val_files: data/val.parquet
  max_prompt_length: 1024
  max_response_length: 2048
  train_batch_size: 256
  val_batch_size: 256

# Algorithm
algorithm:
  gamma: 1.0
  lam: 0.95
  adv_estimator: grpo
  kl_ctrl:
    type: fixed
    kl_coef: 0.001

# Trainer
trainer:
  total_epochs: 3
  project_name: llamia
  experiment_name: qwen3_ppo_vllm
  logger: ["console", "wandb"]
  n_gpus_per_node: 8
  nnodes: 1
  val_before_train: True
  val_freq: 5
  save_freq: 10
  default_hdfs_dir: null
  default_local_dir: checkpoints/qwen3_ppo_vllm
