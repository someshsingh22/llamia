defaults:
  - ppo_trainer
  - _self_

# ── Model ──────────────────────────────────────────────────────────────────
actor_rollout_ref:
  model:
    path: Qwen/Qwen3-4B
    use_remove_padding: true
    enable_gradient_checkpointing: true
    trust_remote_code: true

  actor:
    optim:
      lr: 1e-6
      lr_warmup_steps_ratio: 0.05
    ppo_mini_batch_size: 32
    ppo_micro_batch_size_per_gpu: 1
    use_dynamic_bsz: true
    ppo_max_token_len_per_gpu: 8192
    # DAPO Token-Level Policy Gradient Loss (verified knob name)
    loss_agg_mode: token-mean
    # DAPO Clip-Higher: ε_low=0.2, ε_high=0.28 (clip_ratio_low/high verified)
    clip_ratio_low: 0.2
    clip_ratio_high: 0.28
    entropy_coeff: 0.0
    fsdp_config:
      param_offload: false
      optimizer_offload: false
      fsdp_size: -1

  rollout:
    name: vllm
    mode: async
    # n = GRPO group size G. actor.rollout_n mirrors this value.
    n: 8
    nnodes: 1
    n_gpus_per_node: 8          # all 8 GPUs; lc0 co-resident at ~3 GB/GPU
    temperature: 1.0            # T=1.0 for RL rollouts
    top_p: 0.95
    top_k: 20
    response_length: 4096
    prompt_length: 1024
    max_model_len: 8000
    max_num_batched_tokens: 16384
    gpu_memory_utilization: 0.5  # ~40 GB/GPU for FSDP, rest for rollout vllm
    enable_prefix_caching: true
    tensor_model_parallel_size: 1
    dtype: bfloat16
    engine_kwargs:
      vllm:
        reasoning_parser: qwen3
        tool_call_parser: hermes
        enable_auto_tool_choice: true

    # ── Multi-turn agent loop (tool_agent_loop.py @register("tool_agent")) ──
    multi_turn:
      enable: true
      tool_config_path: agents/verl_tool_config.yaml
      max_assistant_turns: 8   # cap rollout turns; agent stops when done or at 8
      max_tool_response_length: 512
      format: hermes            # Qwen3 / hermes tool-call wire format

    agent:
      default_agent_loop: tool_agent
      num_workers: 8

  ref:
    fsdp_config:
      param_offload: true

# ── Critic disabled (GRPO is critic-free) ──────────────────────────────────
critic:
  enable: false

# ── Reward ─────────────────────────────────────────────────────────────────
# Top-level custom_reward_function is migrated → reward.custom_reward_function
# by the reward loop (reward_loop.py lines 57-59).
custom_reward_function:
  path: rewards/puzzle_reward.py
  name: compute_score

reward_model:
  enable: false

# ── Data ───────────────────────────────────────────────────────────────────
data:
  tokenizer: Qwen/Qwen3-4B
  train_files: data/puzzle_train.parquet
  val_files: data/puzzle_val.parquet
  prompt_key: prompt
  reward_fn_key: data_source
  max_prompt_length: 1024
  max_response_length: 4096
  # train_batch_size = num_unique_prompts × rollout.n = 8 prompts × 8 = 64
  train_batch_size: 64
  val_batch_size: 64
  return_raw_chat: true
  # Qwen3: disable <think> block during RL rollouts to avoid the
  # "plans tool but never emits" failure mode (rl_recipes §6).
  apply_chat_template_kwargs:
    enable_thinking: false

# ── Algorithm: GRPO + partial DAPO ────────────────────────────────────────
# Supported in verl 0.7.1: adv_estimator=grpo, norm_adv_by_std_in_grpo,
#   clip_ratio_low/high (under actor), loss_agg_mode=token-mean (under actor).
# Not yet in 0.7.1 config schema: dynamic_sampling, overlong_buffer penalty.
# Those are noted in rl_recipes.md as deferred to a future verl bump.
algorithm:
  gamma: 1.0
  lam: 1.0
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: true
  kl_ctrl:
    type: fixed
    kl_coef: 0.001

# ── Trainer ────────────────────────────────────────────────────────────────
trainer:
  total_epochs: 1               # toy run
  total_training_steps: 100     # cap; lift after first green smoke run
  project_name: llamia
  experiment_name: puzzle_grpo_toy
  logger:
    - console
    - wandb
  n_gpus_per_node: 8
  nnodes: 1
  val_before_train: true
  val_freq: 25
  save_freq: 50
  default_hdfs_dir: null
  default_local_dir: checkpoints/puzzle_grpo_toy
