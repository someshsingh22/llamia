defaults:
  - ppo_trainer
  - _self_

# ── Model ──────────────────────────────────────────────────────────────────
actor_rollout_ref:
  model:
    path: Qwen/Qwen3-4B
    use_remove_padding: false
    enable_gradient_checkpointing: true
    trust_remote_code: true
    # flash_attn is not installed; use PyTorch SDPA (nearly as fast on A100).
    override_config:
      attn_implementation: sdpa

  actor:
    optim:
      lr: 1e-6
      lr_warmup_steps_ratio: 0.05
    ppo_mini_batch_size: 16
    ppo_micro_batch_size_per_gpu: 1
    use_dynamic_bsz: true
    ppo_max_token_len_per_gpu: 6144
    # DAPO Token-Level Policy Gradient Loss (verified knob name)
    loss_agg_mode: token-mean
    # DAPO Clip-Higher: ε_low=0.2, ε_high=0.28 (clip_ratio_low/high verified)
    clip_ratio_low: 0.2
    clip_ratio_high: 0.28
    # EGPO entropy bonus (arXiv 2508.05118): specifically improves Qwen3-4B on BFCL.
    # Defends against entropy collapse after Clip-Higher; 0.001 is the conservative start.
    entropy_coeff: 0.001
    fsdp_config:
      param_offload: true
      optimizer_offload: true
      fsdp_size: -1

  rollout:
    name: vllm
    mode: async
    # n = GRPO group size G. actor.rollout_n mirrors this value.
    # n=4: 16 prompts × 4 = 64 trajectories on GPU (~14 GiB buffer at 5120 pad, 8 fields).
    # train_batch_size=32 OOMed regardless of n (training floor 60.77 GiB too high).
    n: 4
    nnodes: 1
    n_gpus_per_node: 8          # all 8 GPUs; lc0 co-resident at ~3 GB/GPU
    temperature: 1.0            # T=1.0 for RL rollouts
    top_p: 0.95
    top_k: 20
    response_length: 4096
    prompt_length: 1024
    max_model_len: 5500
    max_num_batched_tokens: 8192
    # vLLM 0.14.0: cuMemRelease bug (issue #25171) is fixed (was broken in 0.10.2).
    # free_cache_engine=true sleeps vLLM during FSDP backward, releasing KV cache
    # (~15.5 GB at gmu=0.35) so the 9.27 GB FSDP all-gather has ~12 GB headroom.
    gpu_memory_utilization: 0.35
    free_cache_engine: true
    enable_prefix_caching: true
    tensor_model_parallel_size: 1
    dtype: bfloat16
    engine_kwargs:
      vllm:
        reasoning_parser: qwen3
        tool_call_parser: hermes
        enable_auto_tool_choice: true

    # ── Multi-turn agent loop (tool_agent_loop.py @register("tool_agent")) ──
    multi_turn:
      enable: true
      tool_config_path: agents/verl_tool_config.yaml
      max_assistant_turns: 8   # cap rollout turns; agent stops when done or at 8
      max_tool_response_length: 512
      format: hermes            # Qwen3 / hermes tool-call wire format

    agent:
      default_agent_loop: tool_agent
      num_workers: 8

  ref:
    fsdp_config:
      param_offload: true

# ── Critic disabled (GRPO is critic-free) ──────────────────────────────────
critic:
  enable: false

# ── Reward ─────────────────────────────────────────────────────────────────
# Top-level custom_reward_function is migrated → reward.custom_reward_function
# by the reward loop (reward_loop.py lines 57-59).
custom_reward_function:
  path: rewards/puzzle_reward.py
  name: compute_score

reward_model:
  enable: false

# ── Data ───────────────────────────────────────────────────────────────────
data:
  tokenizer: Qwen/Qwen3-4B
  # Materialized from ssingh22/llamia-verl-data / puzzle_popularity_elo by
  # scripts/train_puzzle_grpo.sh. HF remains the source of truth; set
  # PUZZLE_N_TRAIN / PUZZLE_N_TEST / PUZZLE_SAMPLE_SEED to control samples.
  train_files: .cache/llamia_verl_data/puzzle_popularity_elo/train.parquet
  val_files: .cache/llamia_verl_data/puzzle_popularity_elo/test.parquet
  prompt_key: prompt
  reward_fn_key: data_source
  max_prompt_length: 1024
  max_response_length: 4096
  # train_batch_size = num_unique_prompts. Total trajectories = train_batch_size × rollout.n
  # = 16 × 4 = 64 trajectories on GPU. 32 OOMed: training(60.77)+vLLM(8.73)+lc0(2.91)=72.41 GiB,
  # only 6.84 GiB free vs 9.27 GiB needed for FSDP all-gather during backward.
  train_batch_size: 16
  val_batch_size: 64
  return_raw_chat: true
  # Qwen3: disable <think> block during RL rollouts to avoid the
  # "plans tool but never emits" failure mode (rl_recipes §6).
  apply_chat_template_kwargs:
    enable_thinking: false

# ── Algorithm: GRPO + partial DAPO ────────────────────────────────────────
# Supported in verl 0.7.1: adv_estimator=grpo, norm_adv_by_std_in_grpo,
#   clip_ratio_low/high (under actor), loss_agg_mode=token-mean (under actor).
# Not yet in 0.7.1 config schema: dynamic_sampling, overlong_buffer penalty.
# Those are noted in rl_recipes.md as deferred to a future verl bump.
algorithm:
  gamma: 1.0
  lam: 1.0
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: true
  kl_ctrl:
    type: fixed
    kl_coef: 0.001

# ── Trainer ────────────────────────────────────────────────────────────────
trainer:
  total_epochs: 1               # toy run
  total_training_steps: 100     # cap; lift after first green smoke run
  project_name: llamia
  experiment_name: puzzle_grpo_toy
  logger:
    - console
    - wandb
  n_gpus_per_node: 8
  nnodes: 1
  val_before_train: true
  val_freq: 25
  save_freq: 50
  default_hdfs_dir: null
  default_local_dir: checkpoints/puzzle_grpo_toy
